name: Iris Windows internal build

on:
  workflow_dispatch:
    inputs:
      configuration:
        type: choice
        options: [Release, Debug]
        default: Release
      architecture:
        type: choice
        options: [x64, arm64, both]
        default: x64

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(inputs.architecture == 'both' && '["x64","arm64"]' || format('["{0}"]', inputs.architecture)) }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      CONFIGURATION: ${{ inputs.configuration }}
      ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build and package
        shell: pwsh
        run: ./scripts/Build-Windows.ps1 -Configuration $env:CONFIGURATION -Architecture $env:ARCHITECTURE -Msix
      - name: Upload internal package and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-windows-${{ matrix.architecture }}-${{ inputs.configuration }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            artifacts/${{ inputs.configuration }}/${{ matrix.architecture }}/*.zip
            artifacts/${{ inputs.configuration }}/${{ matrix.architecture }}/*.msix
            artifacts/${{ inputs.configuration }}/${{ matrix.architecture }}/*.sha256
            artifacts/${{ inputs.configuration }}/${{ matrix.architecture }}/*.log
